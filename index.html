<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="emberfall-version" content="0.64.45">
  <meta name="emberfall-release" content="156">
  <meta name="theme-color" content="#141822">
  <meta name="description" content="裂界遺火角色選擇與遊戲入口。">
  <title>裂界遺火</title>
  <link rel="icon" href="./icons/emberfall-192.png" type="image/png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/emberfall-180.png">
  <link rel="stylesheet" href="./home.css?v=154" data-home-style>
  <link rel="stylesheet" href="./appearance-picker.css?v=109">
  <link rel="stylesheet" href="./settings-ui.css?v=154">
</head>
<body>
  <div data-home-view>
  <img class="title-art" src="./art/title-screen.webp?v=149" width="1672" height="941" alt="" fetchpriority="high">
  <main class="title-screen">
    <div class="title-shell">
      <div class="title-heading"><h1>裂界遺火</h1><button type="button" class="title-secondary" data-home-settings aria-haspopup="dialog">設定</button></div>
      <section class="title-roster" aria-label="遊戲角色">
        <div class="realm-switch" role="group" aria-label="遊玩模式" hidden>
          <button type="button" data-realm="verified" aria-pressed="false">公測</button>
          <button type="button" data-realm="local" aria-pressed="false">本機</button>
        </div>
        <button class="title-primary" type="button" data-home-signin hidden>使用 Google 登入</button>
        <div class="roster-choice" hidden>
          <div class="roster-heading">
            <h2 id="roster-title">選擇角色</h2>
            <button class="title-secondary" type="button" data-home-new>新角色</button>
          </div>
          <ul class="roster-list" data-home-character aria-labelledby="roster-title"></ul>
          <div class="roster-character-actions" data-home-character-actions hidden>
            <button type="button" data-home-rename>重新命名</button>
            <button type="button" data-home-delete>刪除角色</button>
          </div>
        </div>
        <form class="roster-edit" data-home-edit autocomplete="off" hidden>
          <fieldset>
            <label class="title-field" data-home-rename-field>角色名稱 <input name="name" maxlength="24"></label>
            <p data-home-delete-message hidden></p>
            <div class="create-actions">
              <button type="button" class="title-secondary" data-home-edit-cancel>取消</button>
              <button type="submit" class="title-primary" data-home-edit-submit></button>
            </div>
          </fieldset>
        </form>
        <form class="roster-create" autocomplete="off" hidden>
          <fieldset>
            <label class="title-field character-name">角色名稱 <small>選填</small>
              <input name="name" maxlength="24" placeholder="無名旅人">
            </label>
            <div data-home-appearance></div>
            <fieldset class="weapon-picker">
              <legend>起始武器</legend>
              <div class="weapon-options" data-home-weapons></div>
            </fieldset>
            <div class="create-actions">
              <button type="submit" class="title-primary">建立角色</button>
              <button type="button" class="title-secondary" data-home-cancel hidden>取消</button>
            </div>
          </fieldset>
        </form>
        <a class="title-primary title-enter" data-home-enter href="./index.html?view=play" hidden>進入遊戲 <span aria-hidden="true">→</span></a>
        <p class="title-status" role="status">載入角色…</p>
        <button class="title-secondary" type="button" data-cancel-entry hidden>取消載入</button>
        <div class="roster-recovery">
          <button class="title-secondary" type="button" data-home-retry hidden>重新讀取</button>
          <a href="./play.html?direct=1" data-home-recovery hidden>存檔復原</a>
        </div>
      </section>
    </div>
  </main>
  <dialog id="home-settings" class="home-settings" aria-labelledby="home-settings-title">
    <svg class="home-symbols" width="0" height="0" aria-hidden="true"><symbol id="i-title-close" viewBox="0 0 24 24"><path d="m5 5 14 14M5 19 19 5" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol></svg>
    <header class="dialog-header"><h2 id="home-settings-title">遊戲設定</h2><button class="modal-close" type="button" aria-label="關閉設定" title="關閉設定"><svg aria-hidden="true"><use href="#i-title-close"/></svg></button></header>
    <div class="settings-tools game-top-tools"><button type="button" data-home-fullscreen>全螢幕</button></div>
    <div data-home-settings-content></div>
    <input id="home-import-file" type="file" accept="application/json,application/gzip,.json,.gz" hidden>
    <p class="title-status" role="status" data-home-settings-status></p>
  </dialog>
  </div>
  <script type="module" src="./home-launch.js?v=156"></script>
  <script type="module" src="./pwa.js?v=154"></script>
</body>
</html>
